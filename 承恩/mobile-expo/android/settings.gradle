pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'TakeCareMobile'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

def nodeModulesDir = new File(settingsDir, '../node_modules')
project(':react-native-async-storage_async-storage').projectDir = new File(nodeModulesDir, '@react-native-async-storage/async-storage/android')
project(':react-native-vector-icons').projectDir = new File(nodeModulesDir, 'react-native-vector-icons/android')
project(':react-native-webview').projectDir = new File(nodeModulesDir, 'react-native-webview/android')
