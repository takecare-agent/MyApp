# 可選：本機 MinIO（S3 API）。未啟動時 backend 會用 data/evidence 本機目錄。
# 用法：
#   cd backend && docker compose -f docker-compose.minio.yml up -d
# backend/.env 可加：
#   MINIO_ENDPOINT=http://127.0.0.1:9000
#   MINIO_ACCESS_KEY=takecare
#   MINIO_SECRET_KEY=takecare_secret
#   MINIO_BUCKET=takecare-evidence
# 並 npm i @aws-sdk/client-s3（選用）
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: takecare
      MINIO_ROOT_PASSWORD: takecare_secret
    volumes:
      - minio_data:/data

volumes:
  minio_data:
